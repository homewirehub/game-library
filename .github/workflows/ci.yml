name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      buildDesktop:
        description: 'Run desktop packaging job'
        required: false
        default: 'false'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (all packages)
        run: pnpm test:unit

      - name: E2E tests (backend)
        run: pnpm test:e2e
        env:
          DB_SQLITE_DRIVER: sqlite
          DB_PATH: ':memory:'
          NODE_ENV: test

      - name: Build (backend + frontend only)
        run: pnpm build # desktop packaging is excluded by this script

  desktop-package:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.buildDesktop == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package desktop (electron-builder)
        run: pnpm --filter desktop build
