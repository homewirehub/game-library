<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game.Lib - Modern Game Library Manager</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Meta tags for better SEO and sharing -->
    <meta
      name="description"
      content="A modern game library manager with itch.io and Steam integration"
    />
    <meta name="keywords" content="games, library, manager, itch.io, steam, download, organize" />
    <meta name="author" content="Game.Lib" />

    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#0ea5e9" />
    <meta name="msapplication-TileColor" content="#0ea5e9" />

    <!-- Prevent flash of unstyled content -->
    <style>
      html {
        font-family:
          'Inter',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
      }

      body {
        margin: 0;
        padding: 0;
        background: var(--color-neutral-0, #0f172a);
        color: var(--color-neutral-900, #ffffff);
        line-height: 1.5;
      }

      #root {
        min-height: 100vh;
      }

      /* Loading animation */
      .initial-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: linear-gradient(
          135deg,
          var(--color-neutral-0, #0f172a),
          var(--color-neutral-50, #1e293b)
        );
      }

      .initial-spinner {
        width: 48px;
        height: 48px;
        border: 4px solid var(--color-neutral-200, #475569);
        border-top-color: var(--color-primary-500, #0ea5e9);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-loading">
        <div class="initial-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
